<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Componentes Vue.js</title>
  </head>
  <body>
    <div id="app" class="m-4">
      <h1>{{ title }}</h1>
      <div v-for="(image, index) in images" :key="index" class="mb-4">
        <my-image
          v-bind:image-source="image.imageSource"
          v-bind:alternative-text="image.alternativeText"
        />
      </div>

      <div>
        <todo
          list-name="Todo"
          informational-text="Type and hit enter to add a new task"
          :tasks="tasks"
          :show-history="true"
          :task-history="tasksHistory"
          @task-added="handleTaskAdded"
          @task-completed="handleTaskCompleted"
        />
      </div>
    </div>

    <script type="module">
      import MyImage from "./MyImage.js";
      import Todo from "./Todo.js";
      import ActionMenu from "./ActionMenu.js";

      const app = Vue.createApp({
        data() {
          return {
            title: "Componentes Vue.js",
            images: [
              {
                imageSource: "image1.jpg",
                alternativeText: "Descrição da imagem 1",
              },
              {
                imageSource: "image2.jpg",
                alternativeText: "Descrição da imagem 2",
              },
              {
                imageSource: "image3.jpg",
                alternativeText: "Descrição da imagem 3",
              },
            ],
            tasks: [
              { id: 1, text: "Learn Vue", editing: false },
              { id: 2, text: "Build a component", editing: false },
            ],
            tasksHistory: [],
            actions: ["Edit", "Delete", "Share"],
          };
        },
        methods: {
          handleTaskAdded(task) {
            this.tasks.push(task);
          },
          handleTaskCompleted(task) {
            const index = this.tasks.findIndex((t) => t.id === task.id);
            if (index !== -1) {
              this.tasks.splice(index, 1);
              this.tasksHistory.push(task.text);
            }
          },

          handleMoreActions(action) {
            console.log("Parent received action:", action);
          },
        },
      });

      app.component("my-image", MyImage);
      app.component("todo", Todo);
      app.component("action-menu", ActionMenu);
      app.mount("#app");
    </script>
  </body>
</html>
