<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.global.min.js"></script>
    <title>Componentes Vue.js</title>
  </head>
  <body>
    <div id="app">
      <h1>{{ title }}</h1>
      <div v-for="(image, index) in images" :key="index">
        <my-image
          v-bind:image-source="image.imageSource"
          v-bind:alternative-text="image.alternativeText"
        />
      </div>

      <!-- Use o nome registrado "my-todo" -->
      <my-todo
        list-name="Todo"
        informational-text="Type and hit enter to add a new task"
        :tasks="tasks"
        :show-history="true"
        :task-history="tasksHistory"
        @task-added="handleTaskAdded"
        @task-completed="handleTaskCompleted"
      />
    </div>

    <script type="module">
      import MyImage from "./MyImage.js";
      import Todo from "./Todo.js";

      let app = Vue.createApp({
        data() {
          return {
            title: "Componentes Vue.js",
            images: [
              {
                imageSource: "image1.jpg",
                alternativeText: "Descrição da imagem 1",
              },
              {
                imageSource: "image2.jpg",
                alternativeText: "Descrição da imagem 2",
              },
              {
                imageSource: "image3.jpg",
                alternativeText: "Descrição da imagem 3",
              },
            ],
            tasks: [
              { id: 1, text: "Learn Vue" },
              { id: 2, text: "Build a component" },
            ],
            tasksHistory: [],
          };
        },
        methods: {
          handleTaskAdded(task) {
            this.tasks.push(task);
          },
          handleTaskCompleted(task) {
            const index = this.tasks.findIndex((t) => t.id === task.id);
            if (index !== -1) {
              this.tasks.splice(index, 1);
              this.tasksHistory.push(task.text);
            }
          },
        },
      });

      app.component("my-image", MyImage);
      app.component("my-todo", Todo);

      app.mount("#app");
    </script>
  </body>
</html>
